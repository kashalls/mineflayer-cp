{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mineflayer-cp.fullname" . }}-bots
  labels:
    {{- include "mineflayer-cp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mineflayer-cp-bot
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "mineflayer-cp.selectorLabels" . | nindent 14 }}
      ports:
        - port: 8080
{{- end }}
