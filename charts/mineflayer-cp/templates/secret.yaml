{{- if not .Values.secret.existingSecret }}
{{- $name := include "mineflayer-cp.fullname" . }}
{{- /* Generated values are read back from the cluster so that upgrades do not rotate them. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mineflayer-cp.labels" . | nindent 4 }}
type: Opaque
data:
  adminPassword: {{ if .Values.secret.adminPassword }}{{ .Values.secret.adminPassword | toString | b64enc }}{{ else }}{{ get $existing "adminPassword" | default (randAlphaNum 24 | b64enc) }}{{ end }}
  mcpToken: {{ if .Values.secret.mcpToken }}{{ .Values.secret.mcpToken | toString | b64enc }}{{ else }}{{ get $existing "mcpToken" | default (randAlphaNum 48 | b64enc) }}{{ end }}
  sessionSecret: {{ get $existing "sessionSecret" | default (randAlphaNum 48 | b64enc) }}
  internalToken: {{ get $existing "internalToken" | default (randAlphaNum 48 | b64enc) }}
  encryptionKey: {{ get $existing "encryptionKey" | default (randAlphaNum 48 | b64enc) }}
{{- end }}
