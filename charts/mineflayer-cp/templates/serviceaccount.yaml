apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mineflayer-cp.fullname" . }}
  labels:
    {{- include "mineflayer-cp.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mineflayer-cp.fullname" . }}
  labels:
    {{- include "mineflayer-cp.labels" . | nindent 4 }}
rules:
  # One Deployment and one Service per account, managed with server-side apply.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mineflayer-cp.fullname" . }}
  labels:
    {{- include "mineflayer-cp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mineflayer-cp.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mineflayer-cp.fullname" . }}
    namespace: {{ .Release.Namespace }}
